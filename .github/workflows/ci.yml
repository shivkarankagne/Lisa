# SPDX-License-Identifier: BUSL-1.1
#
# CI for the working product (plan W1): build and run every test on
# ARM64 macOS, in the Release (-O2) and sanitizer (ASan + UBSan) builds.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS ARM64 (${{ matrix.config.name }})
    runs-on: macos-15
    # CI's Macs run the models on the CPU, so the release job's model tests
    # take hours where a local M2 takes minutes (report 013).
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: release,  args: "-DCMAKE_BUILD_TYPE=Release" }
          # Model inference under ASan on CI's CPU-only VMs takes > 30 min;
          # the sanitizer job runs the model-free tests (models dir absent).
          # Release runs every model test; inference is sanitizer-tested locally.
          - { name: sanitize, args: "-DCMAKE_BUILD_TYPE=Debug -DLISA_SANITIZE=ON -DLISA_MODELS_DIR=/nonexistent" }
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          uname -m
          clang --version
          cmake --version

      - name: Cache models
        if: matrix.config.name == 'release'
        uses: actions/cache@v4
        with:
          path: models
          key: models-qwen3-4b-q4km-bc640142-qwen3-emb-06b-q8-370f27d7

      - name: Download models (verified)
        if: matrix.config.name == 'release'
        run: |
          mkdir -p models
          get() {  # repo revision file sha256
            if [ ! -f "models/$3" ]; then
              curl -sfL --retry 5 -o "models/$3.part" "https://huggingface.co/$1/resolve/$2/$3"
              echo "$4  models/$3.part" | shasum -a 256 -c -
              mv "models/$3.part" "models/$3"
            fi
          }
          get Qwen/Qwen3-4B-GGUF bc640142c66e1fdd12af0bd68f40445458f3869b \
              Qwen3-4B-Q4_K_M.gguf 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
          get Qwen/Qwen3-Embedding-0.6B-GGUF 370f27d7550e0def9b39c1f16d3fbaa13aa67728 \
              Qwen3-Embedding-0.6B-Q8_0.gguf 06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439

      - name: Fetch PDFium (prebuilt, SHA-256 verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_pdfium.sh

      - name: Configure
        run: cmake -S . -B build -DLISA_REQUIRE_PDF=ON ${{ matrix.config.args }}

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 900

      - name: Single-executable check
        if: matrix.config.name == 'release'
        run: |
          otool -L build/lisa
          # Only system libraries and frameworks may appear.
          if otool -L build/lisa | tail -n +2 | grep -vE '^\s+(/usr/lib/|/System/Library/)'; then
            echo "error: build/lisa links a non-system library"
            exit 1
          fi

  # The Linux port (plan W13): the portable core, plus PDF, built and
  # tested on real Linux. No GPU and no models yet; those tests skip
  # themselves. Confirms the platform layer, kernels, storage, retrieval,
  # context and PDF extraction compile and pass off macOS.
  linux-x64:
    name: Linux x64 (headless, no models)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
          uname -m
          cc --version
          ld.lld --version
          cmake --version

      - name: Fetch PDFium (prebuilt, SHA-256 verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_pdfium.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLISA_REQUIRE_PDF=OFF -DLISA_MODELS_DIR=/nonexistent

      - name: Build
        run: cmake --build build -j "$(nproc)"

      # TEMPORARY: backtrace the startup segfault.
      - name: Diagnose startup crash
        run: |
          sudo apt-get install -y gdb
          gdb -batch -ex run -ex bt -ex quit --args ./build/lisa --version || true

      # test_gui needs a browser; it is exercised on macOS. Model tests
      # self-skip without models.
      - name: Test (model- and GUI-free tests)
        run: ctest --test-dir build --output-on-failure --timeout 900 -E "test_gui"

      - name: Runtime smoke check
        run: |
          ./build/lisa --version
          ldd build/lisa || true
