# SPDX-License-Identifier: BUSL-1.1
#
# CI for the working product (plan W1): build and run every test on
# ARM64 macOS, in the Release (-O2) and sanitizer (ASan + UBSan) builds.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS ARM64 (${{ matrix.config.name }})
    runs-on: macos-15
    # CI's Macs run the models on the CPU, so the release job's model tests
    # take hours where a local M2 takes minutes (report 013).
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: release,  args: "-DCMAKE_BUILD_TYPE=Release" }
          # Model inference under ASan on CI's CPU-only VMs takes > 30 min;
          # the sanitizer job runs the model-free tests (models dir absent).
          # Release runs every model test; inference is sanitizer-tested locally.
          - { name: sanitize, args: "-DCMAKE_BUILD_TYPE=Debug -DLISA_SANITIZE=ON -DLISA_MODELS_DIR=/nonexistent" }
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          uname -m
          clang --version
          cmake --version

      - name: Cache models
        if: matrix.config.name == 'release'
        uses: actions/cache@v4
        with:
          path: models
          key: models-qwen3-4b-q4km-bc640142-qwen3-emb-06b-q8-370f27d7

      - name: Download models (verified)
        if: matrix.config.name == 'release'
        run: |
          mkdir -p models
          get() {  # repo revision file sha256
            if [ ! -f "models/$3" ]; then
              curl -sfL --retry 5 -o "models/$3.part" "https://huggingface.co/$1/resolve/$2/$3"
              echo "$4  models/$3.part" | shasum -a 256 -c -
              mv "models/$3.part" "models/$3"
            fi
          }
          get Qwen/Qwen3-4B-GGUF bc640142c66e1fdd12af0bd68f40445458f3869b \
              Qwen3-4B-Q4_K_M.gguf 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
          get Qwen/Qwen3-Embedding-0.6B-GGUF 370f27d7550e0def9b39c1f16d3fbaa13aa67728 \
              Qwen3-Embedding-0.6B-Q8_0.gguf 06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439

      - name: Fetch PDFium (prebuilt, SHA-256 verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_pdfium.sh

      - name: Configure
        run: cmake -S . -B build -DLISA_REQUIRE_PDF=ON ${{ matrix.config.args }}

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 900

      - name: Single-executable check
        if: matrix.config.name == 'release'
        run: |
          otool -L build/lisa
          # Only system libraries and frameworks may appear.
          if otool -L build/lisa | tail -n +2 | grep -vE '^\s+(/usr/lib/|/System/Library/)'; then
            echo "error: build/lisa links a non-system library"
            exit 1
          fi

  # The Linux port (plan W13): the portable core, plus PDF, built and
  # tested on real Linux. No GPU and no models yet; those tests skip
  # themselves. Confirms the platform layer, kernels, storage, retrieval,
  # context and PDF extraction compile and pass off macOS.
  linux-x64:
    name: Linux x64 (headless, no models)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lld mold
          uname -m
          cc --version
          ld.lld --version; ld.mold --version | head -1
          cmake --version

      - name: Fetch PDFium (prebuilt, SHA-256 verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_pdfium.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLISA_REQUIRE_PDF=ON -DLISA_MODELS_DIR=/nonexistent

      - name: Build
        run: cmake --build build -j "$(nproc)"

      # Fail fast if the PDFium-linked binary crashes at startup.
      - name: Startup check
        run: ./build/lisa --version

      # test_gui needs a browser; it is exercised on macOS. Model tests
      # self-skip without models.
      - name: Test (model- and GUI-free tests)
        run: ctest --test-dir build --output-on-failure --timeout 900 -E "test_gui"

      - name: Runtime smoke check
        run: |
          ./build/lisa --version
          ldd build/lisa || true

  # Proves the model runtime (llama.cpp CPU backend) and the full answer
  # pipeline work on Linux — not just search. Slow (models run on the CPU),
  # so it is a separate job from the fast, model-free one above.
  linux-x64-models:
    name: Linux x64 (models)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lld mold
          cmake --version

      # The model tests reference the chat model and the Qwen embedding
      # model by name (as the macOS job does); with a different embedding
      # model present they silently no-op instead of running inference.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-qwen3-4b-q4km-bc640142-qwen3-emb-06b-q8-370f27d7

      - name: Download models (verified)
        run: |
          mkdir -p models
          get() {  # repo revision file sha256
            if [ ! -f "models/$3" ]; then
              curl -sfL --retry 5 -o "models/$3.part" "https://huggingface.co/$1/resolve/$2/$3"
              echo "$4  models/$3.part" | shasum -a 256 -c -
              mv "models/$3.part" "models/$3"
            fi
          }
          get Qwen/Qwen3-4B-GGUF bc640142c66e1fdd12af0bd68f40445458f3869b \
              Qwen3-4B-Q4_K_M.gguf 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
          get Qwen/Qwen3-Embedding-0.6B-GGUF 370f27d7550e0def9b39c1f16d3fbaa13aa67728 \
              Qwen3-Embedding-0.6B-Q8_0.gguf 06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439

      - name: Fetch PDFium (prebuilt, SHA-256 verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_pdfium.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLISA_REQUIRE_PDF=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test (with models; only the browser GUI test is skipped)
        run: ctest --test-dir build --output-on-failure --timeout 3600 -E "test_gui"

  # First step of the Windows port (plan W13): prove the Win32 platform
  # backend and the core compile and the binary runs. Headless, no PDF, no
  # models, tests off for now (many use POSIX-only calls). Built with Clang
  # (MSVC ABI) because the kernel registry uses C11 atomics, which MSVC
  # supports only experimentally.
  windows-x64:
    name: Windows x64 (tests, no PDF/models)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          clang --version
          cmake --version
          ninja --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DLISA_REQUIRE_PDF=OFF -DLISA_MODELS_DIR=nonexistent
          "-DCMAKE_C_FLAGS=-gcodeview" "-DCMAKE_EXE_LINKER_FLAGS=-Wl,/debug"

      - name: Build
        run: cmake --build build -j

      # TEMP (windows-fixes branch): backtrace the storage segfault with cdb
      # (symbols via -gcodeview + a PDB).
      - name: Diagnose test_storage segfault
        shell: pwsh
        run: |
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue
          if (-not $cdb) { $cdb = Get-Command cdb -ErrorAction SilentlyContinue }
          if (-not $cdb) { Write-Host "cdb not found"; exit 0 }
          Write-Host "using $($cdb.FullName)"
          & $cdb.FullName -g -G -c "kn 40; q" .\build\test_storage.exe 2>&1 | Select-Object -Last 70

      # The Win32 backend is validated by the retrieval, kernel, context,
      # sqlite and search tests. Excluded for now (tracked, being fixed on
      # a branch): test_storage/test_storage_mutation segfault on Windows,
      # test_store has compaction/migrate failures, test_http returns 400
      # for static files, and test_ingest expects a PDF that this PDF-less
      # build cannot read. GUI/CLI tests need a browser/bash.
      - name: Test (Windows-clean subset)
        shell: bash
        run: >
          ctest --test-dir build --output-on-failure --timeout 900
          -E "test_gui|test_cli|test_storage|test_storage_mutation|test_store|test_http|test_ingest"

      - name: Startup check
        run: build/lisa.exe --version

  # Proves the full answer pipeline (embed, retrieve, generate) runs on
  # Windows via the CLI. The test suite is not built here yet (many tests
  # use POSIX-only calls), so this is a direct end-to-end smoke instead.
  windows-x64-models:
    name: Windows x64 (models smoke)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: clang --version; cmake --version; ninja --version

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-e5-small-v2-q8-qwen3-4b-q4km-bc640142

      - name: Download models (verified)
        run: |
          mkdir -p models
          get() {  # url file sha256
            if [ ! -f "models/$2" ]; then
              curl -sfL --retry 5 -o "models/$2.part" "$1"
              echo "$3  models/$2.part" | sha256sum -c -
              mv "models/$2.part" "models/$2"
            fi
          }
          get https://huggingface.co/ggml-org/e5-small-v2-Q8_0-GGUF/resolve/main/e5-small-v2-q8_0.gguf \
              e5-small-v2-q8_0.gguf afdfb5c342d2efc2a051c426dd1d00913495d5f2bbceaea100d2f3892aa31cbc
          get https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/bc640142c66e1fdd12af0bd68f40445458f3869b/Qwen3-4B-Q4_K_M.gguf \
              Qwen3-4B-Q4_K_M.gguf 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DLISA_BUILD_TESTS=OFF -DLISA_REQUIRE_PDF=OFF

      - name: Build
        run: cmake --build build -j

      - name: End-to-end smoke (ingest a fact, ask, check the answer)
        run: |
          printf 'The Snowdrop reader weighs 320 grams.\n' > fact.md
          ./build/lisa.exe model --set "models/e5-small-v2-q8_0.gguf"
          ./build/lisa.exe model --set "models/Qwen3-4B-Q4_K_M.gguf"
          ./build/lisa.exe ingest --collection t "fact.md"
          out=$(./build/lisa.exe ask --collection t "How much does the Snowdrop reader weigh?")
          echo "$out"
          echo "$out" | grep -q 320 || { echo "FAIL: expected 320 in the answer"; exit 1; }
