# SPDX-License-Identifier: BUSL-1.1
#
# Build and package LISA for each platform with scripts/release.sh, and
# upload the tarballs as build artifacts. Run manually. With inputs.publish
# set to "yes" it also attaches them to the GitHub release v<version>.
#
# It verifies the whole release path per platform, including the
# single-executable check (otool on macOS, ldd on Linux).

name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach to the GitHub release (yes/no)'
        default: 'no'

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,      name: macOS }
          - { os: ubuntu-latest, name: Linux }
    name: ${{ matrix.name }} package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Linux toolchain (linker for the PDFium objects)
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld mold

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-qwen3-4b-q4km-bc640142-qwen3-emb-06b-q8-370f27d7

      - name: Download models (verified)
        run: |
          mkdir -p models
          get() {  # repo revision file sha256
            if [ ! -f "models/$3" ]; then
              curl -sfL --retry 5 -o "models/$3.part" "https://huggingface.co/$1/resolve/$2/$3"
              echo "$4  models/$3.part" | shasum -a 256 -c -
              mv "models/$3.part" "models/$3"
            fi
          }
          get Qwen/Qwen3-4B-GGUF bc640142c66e1fdd12af0bd68f40445458f3869b \
              Qwen3-4B-Q4_K_M.gguf 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
          get Qwen/Qwen3-Embedding-0.6B-GGUF 370f27d7550e0def9b39c1f16d3fbaa13aa67728 \
              Qwen3-Embedding-0.6B-Q8_0.gguf 06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439

      - name: Fetch PDFium (prebuilt, SHA-256 verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_pdfium.sh

      - name: Build, check and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.publish }}" = "yes" ]; then
            scripts/release.sh --publish
          else
            scripts/release.sh
          fi

      - name: Upload the tarball as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lisa-${{ matrix.name }}
          path: dist/*.tar.gz*
